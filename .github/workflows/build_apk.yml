name: Build APK

# Push this project to GitHub and the APK is built for you (Actions tab -> latest run -> Artifacts).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create + patch the Android project
        run: |
          mkdir -p .keep && cp -r lib pubspec.yaml .keep/
          flutter create --platforms=android --org com.sofaar --project-name sofa_ar .
          rm -rf lib pubspec.yaml && cp -r .keep/lib .keep/pubspec.yaml . && rm -rf .keep
          python3 tool/patch_android.py

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: sofa-ar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
