name: sofa_ar
description: Try sofas in your own room using AR or a live camera overlay.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state management
  provider: ^6.1.2

  # 3D viewer + "View in your room" (Google Scene Viewer / ARCore on Android)
  model_viewer_plus: ^1.8.0

  # live camera for the overlay mode
  camera: ^0.11.0+2
  permission_handler: ^11.3.1

  # picking / storing / sharing
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  share_plus: ^10.1.4

  # image processing + calling the image-to-3D API
  image: ^4.3.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
